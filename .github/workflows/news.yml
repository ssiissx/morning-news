name: 아침 뉴스

on:
  # 정시 실행은 cron-job.org가 한국 시간 짝수 시 20분(00:20, 02:20, … 06:20, … 22:20)마다 아래
  # workflow_dispatch를 불러서 한다. GitHub 예약은 늦거나 아예 안 돌아서(2026-10-29 오후~30일 새벽 8번 중
  # 2번만, 그것도 1시간씩 늦게) 갱신 시각이 들쭉날쭉했다.
  # 이 예약은 cron-job.org가 끊겼을 때(토큰 만료 등)만 대신 도는 예비 — 아래 gate 참고.
  schedule:
    - cron: "20 1-23/2 * * *"
  workflow_dispatch:       # cron-job.org가 부르는 곳. Actions 탭의 'Run workflow'도 같다.
  push:
    branches: [main]
    paths-ignore: ["index.html", "archive/**", "feeds.opml"]

permissions:
  actions: read        # gate가 최근 실행 기록을 본다
  contents: write
  pages: write
  id-token: write

# 예약·수동·push 실행이 겹쳐도 한 번에 하나만 돌린다. 진행 중인 실행은 끊지 않고 기다리게 한다
# (끊으면 커밋·배포가 중간에 멈춘다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub 예약 실행은 최근 3시간 안에 cron-job.org(workflow_dispatch) 실행이 있었으면 쉰다.
  # 둘 다 돌면 GitHub의 늦은 실행이 갱신 시각을 다시 들쭉날쭉하게 만든다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh run list -R "$GITHUB_REPOSITORY" -w news.yml -e workflow_dispatch -L 1 --json createdAt -q '.[0].createdAt')
            if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 10800 ]; then
              echo "cron-job.org 실행($last)이 살아 있어 이번 예약은 건너뛰어요"
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # 아래 단계별 재시도까지 다 써도 끝나도록 넉넉히. 멈춰 버린 실행이 끝없이 도는 것만 막는다.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # 뜻 비교 모델을 돌릴 도구. PyTorch는 GPU용(수 GB)을 피하려고 CPU판을 따로 받는다.
      # 내려받기는 일시적으로 끊기기 쉬워 몇 번 다시 해 보고, 끝내 실패해도 멈추지 않는다 —
      # 그날은 제목 글자만 비교해서 페이지를 만든다(아래 경고로 알린다).
      - name: 도구 설치
        id: tools
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source .github/scripts/ci-helpers.sh
          retry 3 20 pip install --retries 5 --timeout 60 torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          retry 3 20 pip install --retries 5 --timeout 60 -r scripts/requirements.txt

      - name: 도구 설치 실패 알림
        if: steps.tools.outcome == 'failure'
        run: echo "::warning title=뜻 비교 모델 없이 실행::도구 설치가 계속 실패해서 오늘은 제목 글자만 비교해 묶어요."

      # 모델(약 0.45GB)은 처음 한 번 받아 캐시에 두고 다음 날부터 다시 받지 않는다
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-jhgan-ko-sroberta-multitask

      # 받아진 출처가 너무 적으면 build_news.py 가 실패로 끝난다. 대부분 그 시각의 일시적인
      # 네트워크 문제라서 간격을 두고 다시 해 본다.
      - name: 뉴스 모으기
        timeout-minutes: 15
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          source .github/scripts/ci-helpers.sh
          retry 3 60 python scripts/build_news.py

      # 매일 커밋이 남아야 GitHub가 예약 실행을 멈추지 않는다(60일 무활동 시 정지).
      - name: 기록 저장
        run: |
          source .github/scripts/ci-helpers.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive feeds.opml
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않아요"
            exit 0
          fi
          git commit -m "아침 뉴스 $(TZ=Asia/Seoul date "+%F %H:%M")"
          push_with_rebase "${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
